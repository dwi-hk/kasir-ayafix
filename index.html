<div id="tab-setting" class="hidden p-4 bg-white rounded-lg shadow">
    <h2 class="text-lg font-bold mb-4 text-orange-700">⚙️ Pengaturan Nota & Toko</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
            <label class="block text-xs font-bold mb-1">Nama Toko / Usaha:</label>
            <input type="text" id="settingNamaToko" class="w-full p-2 border rounded text-xs" placeholder="Contoh: DAPUR AYA / AYA SEBLAK">
        </div>
        <div>
            <label class="block text-xs font-bold mb-1">No. Handphone / WhatsApp:</label>
            <input type="text" id="settingNoHp" class="w-full p-2 border rounded text-xs" placeholder="Contoh: 0812-3456-7890">
        </div>
        <div class="col-span-2">
            <label class="block text-xs font-bold mb-1">Alamat Toko:</label>
            <input type="text" id="settingAlamatToko" class="w-full p-2 border rounded text-xs" placeholder="Contoh: Jl. Raya Seblak No. 123">
        </div>
        <div class="col-span-2">
            <label class="block text-xs font-bold mb-1">Pesan Header (Bagian Atas):</label>
            <input type="text" id="settingHeader" class="w-full p-2 border rounded text-xs" placeholder="Contoh: Selamat Datang di Dapur AYA!">
        </div>
        <div class="col-span-2">
            <label class="block text-xs font-bold mb-1">Pesan Footer (Bagian Bawah):</label>
            <textarea id="settingFooter" class="w-full p-2 border rounded text-xs" rows="2" placeholder="Contoh: Terima Kasih atas Kunjungan Anda!"></textarea>
        </div>
    </div>
    <div class="mt-4">
        <button onclick="simpanPengaturanNota()" class="px-4 py-2 bg-orange-600 hover:bg-orange-700 text-white font-bold rounded text-xs">
            💾 Simpan Pengaturan Nota
        </button>
    </div>
</div>
